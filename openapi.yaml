openapi: 3.0.3
info:
  title: LifeOps API
  version: "1.0"
servers:
  - url: http://localhost:8080
paths:
  /v1/ingest/health/workouts:
    post:
      summary: Ingest workouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutsBatch'
      responses:
        '200':
          description: OK
  /v1/ingest/health/sleep:
    post:
      summary: Ingest sleep
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SleepBatch'
      responses:
        '200':
          description: OK
  /v1/ingest/health/metrics:
    post:
      summary: Ingest metrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsBatch'
      responses:
        '200':
          description: OK
  /v1/worker/run:
    post:
      summary: Trigger worker for agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent:
                  type: string
                  description: Agent name
              required:
                - agent
      responses:
        '200':
          description: Worker executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  agent:
                    type: string
components:
  schemas:
    SleepBatch:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sleep'
        deleted:
          type: array
          items:
            $ref: '#/components/schemas/Deletion'
      required: [items, deleted]
    WorkoutsBatch:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workout'
        deleted:
          type: array
          items:
            $ref: '#/components/schemas/Deletion'
      required: [items, deleted]
    MetricsBatch:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        deleted:
          type: array
          items:
            $ref: '#/components/schemas/Deletion'
      required: [items, deleted]
    Workout:
      type: object
      properties:
        id:
          type: string
        workoutType:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        durationMinutes:
          type: number
        distanceMeters:
          type: number
        calories:
          type: number
        averageHeartRate:
          type: number
      required:
        - id
        - workoutType
        - start
        - end
        - durationMinutes
    Sleep:
      type: object
      properties:
        id:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        totalMinutes:
          type: number
        breakdown:
          type: object
          properties:
            remMinutes:
              type: number
            deepMinutes:
              type: number
            coreMinutes:
              type: number
            awakeMinutes:
              type: number
          required:
            - remMinutes
            - deepMinutes
            - coreMinutes
            - awakeMinutes
      required:
        - id
        - start
        - end
        - totalMinutes
        - breakdown
    Metric:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        value:
          type: number
        unit:
          type: string
      required:
        - id
        - kind
        - start
        - end
        - value
        - unit
    Deletion:
      type: object
      properties:
        id:
          type: string
        sampleType:
          type: string
      required:
        - id
        - sampleType
