services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lifeops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    command: ["api"]
    env_file: .env
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      LLM_PROVIDER: ${LLM_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      TIMEZONE: ${TIMEZONE}
      BIND_ADDR: ${BIND_ADDR:-0.0.0.0:8080}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/finance:/app/data/finance
      - ./data/telegram_agents:/app/data/telegram_agents
  bot:
    build: .
    command: ["bot"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/finance:/app/data/finance
      - ./data/telegram_agents:/app/data/telegram_agents
  worker:
    build: .
    command: ["worker"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/finance:/app/data/finance
      - ./data/telegram_agents:/app/data/telegram_agents
volumes:
  pgdata: {}
